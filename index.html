<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
    <title> Student Management 2 </title>
</head>
<body style="background-color: rgb(72, 255, 0);">
    <div class="container">
        <div class="row  mt-5">
            <h4 class="col-4 offset-4"><b style="color: blueviolet;">*Student Management*</b></h4>
            <div class="col-10 offset-1">
                <div class="card " style="color: blueviolet;">
                    <div class="card-body">
                      <form id="form">

                                <label class="mt-2" for="name"><b>Full Name: </b></label>
                                <input id="name" class="form-control shadow" type="text required">

                                <label class="mt-2" for="course"><b>Course:</b></label>
                                <input id="course" class="form-control shadow" type="text required">
                           
                           <label class="mt-4" for="contact"> <b>Contact:</b></label>
                           <input id="contact" class="form-control shadow" type="text required">

                            <label class="mt-4" for="degree"><b>Enter Your Bachelor Degree:</b></label>
                            <input id="degree" class="form-control shadow" type="text" required>

                           <button id="addBtn" class="btn btn-block bg-color border shadow text-black mt-5 "><b>Add</b></button>
                           <button type="button" id="updateBtn" class="btn btn-block bg-color border shadow text-black mt-5 d-none "><b>Update</b></button>
                    </form>
                  </div>
                 </div>
            </div>
            <div class="col-10 offset-1">
                <table class="table mt-5">
                    <thead class="table-dark">
                       <tr>
                        <th>Sr No</th>
                        <th>Student Name</th>
                        <th>Course</th>
                        <th>Contact No</th>
                        <th>Bach. Degree</th>
                        <th>Edit</th>
                        <th>Delete</th>
                       </tr>
                    </thead>

                    <tbody id="tbody" class="table-active"> 
                      
                    </tbody>
                    
                </table>
            </div>
        </div>
    </div>
    <div id="spinner" class="d-none">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
